name: Build game binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            asset: blackbox-ml-game-macos-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: blackbox-ml-game-macos-x86_64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: blackbox-ml-game-windows-x86_64
          # musl: a fully static binary that runs on any x86_64 Linux,
          # whatever its glibc version.
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: blackbox-ml-game-linux-x86_64

    env:
      # Run on macOS 11 and later, not only the runner's version.
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: rust

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build executable
        shell: bash
        run: |
          # Windows: link the C runtime statically so players need no VC++ redistributable.
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        shell: bash
        run: |
          exe="target/${{ matrix.target }}/release/blackbox-ml-game"
          [[ "${{ matrix.target }}" == *windows* ]] && exe="$exe.exe"
          mkdir smoke && cd smoke
          "../$exe" list
          "../$exe" show puzzle_07 --plot
          "../$exe" show puzzle_12
          ls -R outputs

      - name: Zip executable
        shell: bash
        run: |
          # The zip holds just the executable, named after the asset, which is
          # where launch.py expects it after extracting.
          ext=""
          [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          mkdir dist
          cp "target/${{ matrix.target }}/release/blackbox-ml-game$ext" "dist/${{ matrix.asset }}$ext"
          cd dist
          if [[ -n "$ext" ]]; then
            7z a "${{ matrix.asset }}.zip" "${{ matrix.asset }}$ext"
          else
            chmod +x "${{ matrix.asset }}"
            zip "${{ matrix.asset }}.zip" "${{ matrix.asset }}"
          fi
          ls -l

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.zip

  release:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
